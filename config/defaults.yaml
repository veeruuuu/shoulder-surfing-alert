camera:
  index: 0
  width: 640
  height: 480
detection:
  max_faces: 4
  detect_every_n: 2
  min_confidence: 0.5
distance:
  owner_ref_distance_cm: 50
  preset: medium            # close | medium | wide
  presets: {close: 0.60, medium: 0.40, wide: 0.25}
gaze:
  yaw_max: 50
  pitch_max: 35
  smoothing_alpha: 0.4
recognition:
  match_threshold: 0.363
  reid_interval_s: 3
decision:
  confirm_frames: 5
  clear_delay_s: 2.0
  away_after_s: 4.0
  away_action: blur         # blur | lock
  return_grace_s: 1.0
overlay:
  blur_kernel: 99
  downscale: 0.25
  banner_text: "Privacy alert: someone is looking at your screen"
storage:
  snapshot_retention_days: 30
  snapshot_blur_other_faces: false
dashboard:
  host: 127.0.0.1
  port: 5000


